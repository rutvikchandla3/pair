name: Agent Context Budget

# Fails when a PR raises a value in agentContextBudget.json above its base branch's.
# AgentContextBudget.test.ts keeps that file equal to the measured context, so the context
# cannot grow by editing the file.
# To accept growth on purpose, a maintainer adds the agent-context-increase label.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: agent-context-budget-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  budget:
    name: Agent context budget
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      BUDGET: apps/server/src/provider/agentContextBudget.json
      BASE_REF: ${{ github.base_ref }}
      ALLOW_INCREASE: ${{ contains(github.event.pull_request.labels.*.name, 'agent-context-increase') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Pin the merge commit and compare against its first parent, the base branch tip, so
          # the diff is only this PR's change, whatever branch it targets. Not the merge ref:
          # it can move after the event is queued.
          ref: ${{ github.sha }}
          fetch-depth: 2
          sparse-checkout: apps/server/src/provider/agentContextBudget.json
          sparse-checkout-cone-mode: false

      - name: Compare with base branch
        run: |
          # Trees are local; a blob that fails to fetch must fail the step, not read as absent.
          listed=$(git ls-tree --name-only HEAD^1 -- "$BUDGET")
          if [ -z "$listed" ]; then
            echo "$BASE_REF has no agent context budget yet."
            exit 0
          fi
          git show "HEAD^1:$BUDGET" > "$RUNNER_TEMP/base.json"
          grown=$(jq -r --slurpfile base "$RUNNER_TEMP/base.json" '
            to_entries[]
            | select($base[0][.key] != null and .value > $base[0][.key])
            | "\(.key): \($base[0][.key]) -> \(.value) (+\(.value - $base[0][.key]))"
          ' "$BUDGET")
          if [ -z "$grown" ]; then
            echo "Agent context is not larger than $BASE_REF."
            exit 0
          fi
          printf 'Agent context grew compared to %s:\n%s\n' "$BASE_REF" "$grown"
          if [ "$ALLOW_INCREASE" = "true" ]; then
            echo "Accepted by the agent-context-increase label."
            exit 0
          fi
          echo "::error file=$BUDGET::Agent context grew compared to $BASE_REF. Cut the added text and rerun the evals that cover it (evals/README.md), or ask a maintainer to add the agent-context-increase label."
          exit 1
